name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch:

jobs:
  generate-activity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: profile-activity-graph.svg
          theme: dracula

      - name: Commit & Push Generated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-activity-graph.svg
          git commit -m "Update profile activity graph SVG" || exit 0
          git push
